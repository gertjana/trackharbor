name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test --disable-xctest

      - name: Build universal app
        run: ./build-app.sh

      - name: Verify app bundle
        run: |
          lipo -verify_arch arm64 x86_64 TrackHarbor.app/Contents/MacOS/TrackHarbor
          codesign --verify --deep --strict --verbose=2 TrackHarbor.app

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent TrackHarbor.app TrackHarbor.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrackHarbor-macOS
          path: TrackHarbor.zip
          if-no-files-found: error
