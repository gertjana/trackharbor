name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Check release tag matches app version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match app version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

      - name: Run Swift tests
        run: swift test --disable-xctest

      - name: Build universal app
        run: ./build-app.sh

      - name: Verify app bundle
        run: |
          lipo TrackHarbor.app/Contents/MacOS/TrackHarbor -verify_arch arm64
          lipo TrackHarbor.app/Contents/MacOS/TrackHarbor -verify_arch x86_64
          codesign --verify --deep --strict --verbose=2 TrackHarbor.app

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent TrackHarbor.app TrackHarbor.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TrackHarbor-macOS
          path: TrackHarbor.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: TrackHarbor-macOS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" TrackHarbor.zip \
            --verify-tag --title "TrackHarbor ${RELEASE_TAG#v}" --generate-notes
